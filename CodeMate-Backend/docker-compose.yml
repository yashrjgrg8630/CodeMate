services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codemate
      POSTGRES_PASSWORD: codemate
      POSTGRES_DB: codemate
    ports:
      - "5432:5432"
    volumes:
      - codemate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemate -d codemate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codemate_pg:
